@PART[bahaKKV]:FINAL
{
  @cost = 750
  %MODULE[MissileLauncher]
  {

   %targetingType = radar 
   %gpsUpdates = 0

   //%terminalGuidanceShouldActivate = true
   //%terminalGuidanceType = radar
   %terminalGuidanceDistance = 6000
   %activeRadarRange = 8000
   %radarLOAL = True
   %maxOffBoresight = 60
   %lockedSensorFOV = 20
   %chaffEffectivity = 0
   %seekertimeout = 240

   //%terminalHoming = true
   //%terminalHomingType = weave
   //%WeaveUseAGMDescentRatio = false
   //%terminalHomingRange = 3000

   %WeaveVerticalG = 2 
   %WeaveHorizontalG = 2
   %WeaveFrequency = 0.01		
   %WeaveTerminalAngle = -1
   %WeaveFactor = 1 
   %WeaveRandomRange = 1.4

   %missileCMRange = 12000
   %missileRadarCrossSection = 0.25

  }
  //%MODULE[BDCustomWarhead]
  {
   %warheadType = RBSFRAG
   %explModelPath = BDArmory/Models/explosion/explosion
   %explSoundPath = BDArmory/Sounds/explode1
   %bulletTexturePath = BDArmory/Textures/bullet
   %maxDeviation = 180
  }
}

