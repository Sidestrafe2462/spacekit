BULLET
{
    name = KKVWarhead3
	DisplayName = Streak Warhead
	caliber = 80 // True diameter is 210 mm, L/D is 1.25 / 0.210 ~ 5.95 -> Use 80 mm
	bulletVelocity = 0
	bulletMass = 6 // KKV actually only 6 kg in dry mass, but thats not gonna do enough real damage
	explosive = true
	tntMass = 0.4
	fuzeType = none
	incendiary = false
	projectileColor = 200, 150, 0, 200 //RGBA 0-255 
	startColor = 200, 150, 0, 200
	fadeColor = true
	//subProjectileCount = 1
	projectileCount = 1
	apBulletMod = 0.85  //Will go through ~200 mm of armor at an impact velocity of 600 m/s
	bulletDragTypeName = None
	projectileTTL = 0
}
PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = M340Streak
module = Part
author = BahamutoD, Josue, Stardust

// --- asset parameters ---
mesh = KKV_TCA.mu
rescaleFactor = 0.33 // ~1.25m x 0.2m, 0.25m^3 volume

// --- node definitions ---
//node_attach = 0.0, 0.1232686, -0.3764487, 0, 1, 0, 0
//node_stack_top = 0.0, 0.1232686, 0.0, 0, 1, 0, 0

NODE
{
    name = node0
    transform = node0
    size = 0
    method = FIXED_JOINT //FIXED_JOINT, HINGE_JOINT, LOCKED_JOINT, MERGED_PHYSICS or NO_PHYSICS
}

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 8000
cost = 500
category = none
bdacategory = Missiles
subcategory = 0
bulkheadProfiles = srf
title = M340 Streak Point Defense Missile
manufacturer = Odyssey Heavy Industries
description = Built to counter Shivas, Harpoons, and Howlers, the M340 Streak sees much use on most combat warships to supliment their point defense cannons.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1
tags = #loc_BDArmory_part_bahaKKV_tags 
// --- standard part parameters ---
mass = 0.045
dragModelType = default
maximum_drag = 0.1
minimum_drag = 0.1
angularDrag = 2
crashTolerance = 5
maxTemp = 3600


MODULE
{
	name = MissileLauncher
	shortName = KKV

	thrust = 2.65
	cruiseThrust = 0
	dropTime = 0
	boostTime = 45
	cruiseTime = 0

	maxTurnRateDPS = 6 //degrees per second

	decoupleSpeed = 10
	decoupleForward = true

	hasRCS = true
	rcsThrust = 1.4

	audioClipPath = BDArmory/Sounds/jet
	guidanceActive = true //missile has guidanceActive
	homingType = orbital  // Replaces homingType = RCS
	missileType = missile
	
	DetonationDistance = 0
	
	targetingType = heat
	heatThreshold = 0.1
	maxOffBoresight = 180
	lockedSensorFOV = 12.5
	uncagedLock = true
	targetCoM = true // advanced IR targeting, target CoM instead of hottest part
	flareEffectivity = 0 // advanced IR, flares ineffective, use point defense

	minStaticLaunchRange = 500
	maxStaticLaunchRange = 100000

	engageAir = false
	engageMissile = true
	engageGround = false
	engageSLW = false
	
	useFuel = true // mass decreases as fuel burns, missile acceleration is non-constant
	boosterMass = 0 // no independent booster, empty mass is 0.006
	boosterFuelMass = 0.039 // no cruise, just boost
	
	dragArea = 0.0025 // drag will still be applied, missile is not meant for use in-atmo
	
}
// no explosive modules, kinetic warhead
MODULE
{
	name = BDCustomWarhead
	warheadType = KKVWarhead
}
}
