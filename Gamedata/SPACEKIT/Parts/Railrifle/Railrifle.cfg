PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = bahaRailrifle
module = Part
author = SuicidalInsanity/Sidestrafe

// --- asset parameters ---
mesh = Model.mu
rescaleFactor = 1.1


// --- node definitions ---
node_attach = 0.0, 0, 0, 0, -1, 0, 1


// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 3200
category = none
bdacategory = Guns
subcategory = 0

title = (SPW) RG2800/8 "Narcissist" Rail Rifle //Fancy EML
manufacturer = #loc_BDArmory_part_manufacturer
description = Experimental airburst aircraft railgun designed to improve hit rates. When paired with a radar lock, shells guide in on targets. Comes with a fanciful collection of shells. 
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
// --- standard part parameters ---
mass = 0.64
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 60
maxTemp = 3600
stagingIcon = SOLID_BOOSTER
bulkheadProfiles = srf
tags = #loc_BDArmory_part_bahaRailgun_tags

MODULE
	{
		name = ModuleWeapon
		shortName = Narcissist Railrifle

		fireTransformName = fireTransform

		hasDeployAnim = false
		hasFireAnimation = false

		roundsPerMinute = 600
		maxDeviation = 0.2
		RoundsPerMag = 3
        	ReloadTime = 8
		BurstFire = true

		maxEffectiveDistance = 32000
		maxTargetingRange = 48000

		weaponType = ballistic
		bulletType = 37mmHyper; 37mmBluescreen; 37mmNagalfar
		ammoName = baha37mmAmmo
	
		ChargeTime = 0.1 //how long does it take to charge before it can fire (railguns/DEWs/etc)
		ChargeEachShot = False //weapon must charge before each shot
		bulletDmgMult = 1.4
		requestResourceAmount = 1
		shellScale = 0.9
			
		hasRecoil = true
		onlyFireInRange = true
		bulletDrop = true

		tracerOverrideWidth = true //use .cfg values for tracer widths instead of calculated from bullet caliber
		tracerLength = 0
		tracerDeltaFactor = 2.75
		tracerInterval = 0
		tracerStartWidth = 1
		tracerEndWidth = 1
		nonTracerWidth = 1

		autoProxyTrackRange = 1200
		
		chargeSoundPath = BDArmoryExtended/Parts/Railgun/railcharge
		fireSoundPath = BDArmoryExtended/Parts/Railgun/railfire
		overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat

		bulletTexturePath = BDArmoryExtended/Parts/Railgun/bullet //can have custom bullet graphics
		oneShotSound = true
		showReloadMeter = true
		maxHeat = 3600
		heatPerShot = 115
		heatLoss = 825

		//explosion
		explModelPath = BDArmory/Models/explosion/30mmExplosion
		explSoundPath = BDArmory/Sounds/subExplode
	}
